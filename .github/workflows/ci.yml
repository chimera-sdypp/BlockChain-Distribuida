name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # El binario y no gitleaks-action: la action pide licencia en repos de una organización.
      - name: Buscar secretos en todo el historial
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact -v .

  pilar2:
    name: Pilar 2 · tests e imagen
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4.1-alpine
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8.0-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: pilar2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - name: Tests unitarios y de integración
        run: python -m pytest -v
        env:
          INTEGRACION: "1"
      - name: Imagen del ejemplo
        run: docker build --build-arg SERVICIO=ejemplo -t ejemplo .
      - name: Imagen del backend
        run: docker build --build-arg SERVICIO=backend -t backend .
      - name: Imagen del frontend
        run: docker build --build-arg SERVICIO=frontend -t frontend .
