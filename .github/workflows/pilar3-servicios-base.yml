# Pipeline 2 (BC-33): los servicios base en el nodegroup de infra de GKE:
# Traefik (la IP pública), KEDA, RabbitMQ x3 y Redis x3, el Secret con las credenciales, y la
# observabilidad (BC-37): Prometheus, Grafana, Loki y Fluent Bit con los values de pilar2/k8s/monitoreo.
# PR → arma todo (helm template y kustomize) para ver que es válido. Merge a main (o a mano) → lo despliega.
# Mientras no exista la variable GCP_PROYECTO (falta la nube) sólo valida.
name: "Pipeline 2 · Servicios base"

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "pilar3/helm/**"
      - "pilar3/k8s/servicios-base/**"
      - "pilar3/k8s/nodegroup-infra.yaml"
      - "pilar2/k8s/namespace.yaml"
      - "pilar2/k8s/rabbitmq.yaml"
      - "pilar2/k8s/rabbitmq/**"
      - "pilar2/k8s/redis.yaml"
      - "pilar2/k8s/redis/**"
      - "pilar2/k8s/monitoreo/**"
      - ".github/workflows/pilar3-servicios-base.yml"
  push:
    branches: [main]
    paths:
      - "pilar3/helm/**"
      - "pilar3/k8s/servicios-base/**"
      - "pilar3/k8s/nodegroup-infra.yaml"
      - "pilar2/k8s/namespace.yaml"
      - "pilar2/k8s/rabbitmq.yaml"
      - "pilar2/k8s/rabbitmq/**"
      - "pilar2/k8s/redis.yaml"
      - "pilar2/k8s/redis/**"
      - "pilar2/k8s/monitoreo/**"
      - ".github/workflows/pilar3-servicios-base.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: pilar3-servicios-base

env:
  TRAEFIK_VERSION: 42.3.2
  KEDA_VERSION: 2.21.0
  PROMETHEUS_VERSION: 92.13.1   # kube-prometheus-stack
  LOKI_VERSION: 7.6.0
  FLUENT_BIT_VERSION: 0.58.3

jobs:
  gitleaks:
    uses: ./.github/workflows/gitleaks.yml

  validar:
    name: Validar
    needs: [gitleaks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Charts
        run: |
          helm repo add traefik https://traefik.github.io/charts
          helm repo add kedacore https://kedacore.github.io/charts
          helm template traefik traefik/traefik --version "$TRAEFIK_VERSION" -n traefik -f pilar3/helm/traefik.yaml > /dev/null
          helm template keda kedacore/keda --version "$KEDA_VERSION" -n keda -f pilar3/helm/keda.yaml > /dev/null
      - name: Observabilidad
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add fluent https://fluent.github.io/helm-charts
          helm template monitoreo prometheus-community/kube-prometheus-stack --version "$PROMETHEUS_VERSION" -n monitoring \
            -f pilar2/k8s/monitoreo/valores-prometheus.yaml -f pilar3/helm/monitoreo.yaml > /dev/null
          helm template loki grafana/loki --version "$LOKI_VERSION" -n monitoring \
            -f pilar2/k8s/monitoreo/valores-loki.yaml -f pilar3/helm/loki.yaml > /dev/null
          helm template fluent-bit fluent/fluent-bit --version "$FLUENT_BIT_VERSION" -n monitoring \
            -f pilar2/k8s/monitoreo/valores-fluent-bit.yaml > /dev/null
      - name: RabbitMQ, Redis y lo nuestro del monitoreo
        run: |
          kubectl kustomize --load-restrictor LoadRestrictionsNone pilar3/k8s/servicios-base > /dev/null
          kubectl kustomize pilar2/k8s/monitoreo > /dev/null
      - name: Falta la nube
        if: vars.GCP_PROYECTO == ''
        run: echo "::notice::Sin GCP_PROYECTO (falta la nube, BC-31) sólo se valida; no se despliega."

  desplegar:
    name: Desplegar en GKE
    needs: [validar]
    if: vars.GCP_PROYECTO != '' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    environment: produccion   # las credenciales de RabbitMQ, Redis y los mineros son secretos de este ambiente
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVEEDOR }}
          service_account: ${{ vars.GCP_CUENTA_CI }}
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: blockchain
          location: ${{ vars.GCP_ZONA || 'us-central1-a' }}

      - name: Traefik y KEDA
        run: |
          helm repo add traefik https://traefik.github.io/charts
          helm repo add kedacore https://kedacore.github.io/charts
          helm upgrade --install traefik traefik/traefik --version "$TRAEFIK_VERSION" \
            -n traefik --create-namespace -f pilar3/helm/traefik.yaml --wait
          helm upgrade --install keda kedacore/keda --version "$KEDA_VERSION" \
            -n keda --create-namespace -f pilar3/helm/keda.yaml --wait

      # Desde los secretos del ambiente, nunca desde el repo. apply: si ya existe, lo actualiza.
      - name: Secret blockchain-secretos
        env:
          RABBIT_USUARIO: ${{ secrets.RABBIT_USUARIO }}
          RABBIT_CLAVE: ${{ secrets.RABBIT_CLAVE }}
          RABBIT_COOKIE: ${{ secrets.RABBIT_COOKIE }}
          REDIS_CLAVE: ${{ secrets.REDIS_CLAVE }}
          MINER_TOKEN: ${{ secrets.MINER_TOKEN }}
        run: |
          kubectl create namespace blockchain --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n blockchain create secret generic blockchain-secretos \
            --from-literal=RABBIT_USUARIO="$RABBIT_USUARIO" --from-literal=RABBIT_CLAVE="$RABBIT_CLAVE" \
            --from-literal=RABBIT_COOKIE="$RABBIT_COOKIE" --from-literal=REDIS_CLAVE="$REDIS_CLAVE" \
            --from-literal=MINER_TOKEN="$MINER_TOKEN" --dry-run=client -o yaml | kubectl apply -f -

      - name: RabbitMQ y Redis
        run: |
          kubectl kustomize --load-restrictor LoadRestrictionsNone pilar3/k8s/servicios-base | kubectl apply -f -
          kubectl -n blockchain rollout status statefulset/rabbitmq --timeout=10m
          kubectl -n blockchain rollout status statefulset/redis --timeout=10m

      # Prometheus, Alertmanager, Grafana y Loki en el nodegroup de infra; Fluent Bit en todos los nodos.
      # KEDA consulta monitoreo-prometheus.monitoring.svc:9090 (el escalador, BC-29).
      - name: Observabilidad
        env:
          GRAFANA_CLAVE: ${{ secrets.GRAFANA_CLAVE }}
        run: |
          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n monitoring create secret generic grafana-admin --from-literal=admin-user=admin \
            --from-literal=admin-password="$GRAFANA_CLAVE" --dry-run=client -o yaml | kubectl apply -f -
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add fluent https://fluent.github.io/helm-charts
          helm upgrade --install monitoreo prometheus-community/kube-prometheus-stack --version "$PROMETHEUS_VERSION" \
            -n monitoring -f pilar2/k8s/monitoreo/valores-prometheus.yaml -f pilar3/helm/monitoreo.yaml --wait --timeout 10m
          helm upgrade --install loki grafana/loki --version "$LOKI_VERSION" \
            -n monitoring -f pilar2/k8s/monitoreo/valores-loki.yaml -f pilar3/helm/loki.yaml --wait --timeout 10m
          helm upgrade --install fluent-bit fluent/fluent-bit --version "$FLUENT_BIT_VERSION" \
            -n monitoring -f pilar2/k8s/monitoreo/valores-fluent-bit.yaml --wait
          kubectl apply -k pilar2/k8s/monitoreo
