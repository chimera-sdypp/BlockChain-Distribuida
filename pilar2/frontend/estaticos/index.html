<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blockchain distribuida</title>
<link rel="stylesheet" href="/estilos.css">
</head>
<body>
<main>
  <header>
    <h1>Blockchain distribuida</h1>
    <nav><a href="/alta">Pedir el alta</a> <span id="conexion" class="estado">conectando…</span></nav>
  </header>

  <section aria-labelledby="t-transferir">
    <h2 id="t-transferir">Transferir</h2>
    <!-- La clave privada no sale nunca del navegador: se importa como CryptoKey no exportable y se firma acá. -->
    <form id="form-clave" autocomplete="off">
      <label><span>Tu clave privada (el archivo <span class="mono">.jwk</span> que bajaste al pedir el alta, o el JWK de <span class="mono">python -m claves exportar</span>)</span>
        <textarea name="jwk" required spellcheck="false" placeholder='{"kty":"OKP","crv":"Ed25519","d":"…","x":"…"}'></textarea></label>
      <button type="submit">Usar esta clave</button>
    </form>
    <div id="mi-cuenta" class="cuenta" hidden></div>
    <form id="formulario" autocomplete="off" hidden>
      <label>Destino (su cuenta) <input name="destino" required minlength="64" maxlength="64" pattern="[0-9a-f]{64}"
             spellcheck="false" class="mono"></label>
      <label>Monto <input name="monto" required type="number" min="1" step="1"></label>
      <button type="submit">Firmar y enviar</button>
    </form>
    <p id="mensaje" class="mensaje" hidden></p>
    <h2 style="margin-top:16px">Mis transferencias</h2>
    <ul id="mias" class="lista"><li class="vacio">Todavía no hiciste ninguna.</li></ul>
  </section>

  <section aria-labelledby="t-pendientes">
    <h2 id="t-pendientes">Esperando bloque</h2>
    <p id="resumen-cajas" class="suave">Cargando…</p>
    <ul id="pendientes" class="lista"></ul>
  </section>

  <section aria-labelledby="t-cadena">
    <h2 id="t-cadena">Cadena</h2>
    <ul id="bloques" class="lista"><li class="vacio">Cargando…</li></ul>
  </section>
</main>

<script src="/comun.js"></script>
<script>
"use strict";
const BLOQUES_VISIBLES = 20;

// Las transacciones de emisión (origen «emision») crean plata: génesis, coinbase, carga y participación.
// Contrato v3: las actas del organizador (alta, baja, permiso) y los shares de la época también están en la cadena.
const TIPOS_EMISION = [["genesis-", "génesis"], ["organizador-", "organizador"], ["cb-", "recompensa"], ["carga-", "carga"],
  ["part-", "participación"], ["shares-", "shares"], ["alta-", "alta"], ["baja-", "baja"], ["permiso-", "permiso"]];
const tipoDe = (tx) => tx.origen !== "emision"
  ? (/^(alta|baja)-/.test(tx.id) ? `${tx.id.split("-")[0]} delegada` : "")
  : (TIPOS_EMISION.find(([p]) => tx.id.startsWith(p)) || ["", "emisión"])[1];

// ── Cadena ──

let bloques = [];  // del más nuevo al más viejo

function vistaBloque(bloque, nuevo = false) {
  const filas = bloque.transactions.map((tx) => el("tr", {},
    el("td", { clase: "mono", title: tx.origen }, tipoDe(tx) ? el("span", { clase: "chip recompensa" }, tipoDe(tx)) : cuentaCorta(tx.origen)),
    el("td", { clase: "mono", title: tx.destino }, cuentaCorta(tx.destino)),
    el("td", { clase: "num" }, String(tx.monto))));
  return el("li", {}, el("details", nuevo ? { clase: "nuevo" } : {},
    el("summary", {},
      el("span", { clase: "altura" }, `#${bloque.altura}`),
      el("span", { clase: "mono" }, corto(bloque.block_hash)),
      el("span", { clase: "suave" }, `${bloque.transactions.length} tx`),
      el("span", { clase: "suave" }, bloque.minero ? `minó ${cuentaCorta(bloque.minero)}` : "génesis"),
      // BC-86: finalizado = firmado por 2 de 3 validadores. Esto lo dice el servidor; la billetera lo verifica sola.
      bloque.finalizado ? el("span", { clase: "chip confirmada", title: `${(bloque.firmas || []).length} firmas de validadores` }, "finalizado") : ""),
    el("dl", {},
      el("dt", {}, "hash"), el("dd", { clase: "mono" }, bloque.block_hash),
      el("dt", {}, "anterior"), el("dd", { clase: "mono" }, bloque.previous_hash),
      el("dt", {}, "nonce"), el("dd", { clase: "mono" }, String(bloque.nonce)),
      el("dt", {}, "prefijo"), el("dd", { clase: "mono" }, bloque.prefijo || "—"),
      el("dt", {}, "minero"), el("dd", { clase: "mono" }, bloque.minero || "—"),
      el("dt", {}, "recompensa"), el("dd", {}, `${bloque.recompensa} (la coinbase, adentro del hash)`),
      el("dt", {}, "hora"), el("dd", {}, hora(bloque.timestamp))),
    el("table", {},
      el("thead", {}, el("tr", {}, el("th", {}, "origen"), el("th", {}, "destino"), el("th", { clase: "num" }, "monto"))),
      el("tbody", {}, ...filas))));
}

function pintarCadena(nuevo) {
  const lista = $("bloques");
  lista.replaceChildren(...(bloques.length
    ? bloques.map((b) => vistaBloque(b, b.block_hash === nuevo))
    : [el("li", { clase: "vacio" }, "Todavía no hay bloques.")]));
}

async function cargarCadena() {
  const { ok, cuerpo } = await api(`/api/bloques?limite=${BLOQUES_VISIBLES}`);
  if (ok) { bloques = cuerpo; pintarCadena(); }
}

async function bloqueConfirmado(aviso) {
  if (bloques.some((b) => b.block_hash === aviso.block_hash)) return;
  const { ok, cuerpo } = await api(`/api/bloques/${aviso.block_hash}`);
  if (!ok) return;
  bloques = [cuerpo, ...bloques].sort((a, b) => b.altura - a.altura).slice(0, BLOQUES_VISIBLES);
  pintarCadena(cuerpo.block_hash);
}

// ── Mis transferencias (las últimas 20 de este navegador) ──

const MIAS_MAXIMO = 20;
const CLAVE_MIAS = "mis-transferencias";
let mias = [];  // [{id, origen, destino, monto, estado, motivo?, bloque?}], la más nueva primero

function leerIdsGuardados() {
  try { return JSON.parse(localStorage.getItem(CLAVE_MIAS)) || []; } catch { return []; }
}

function guardarIds() {
  try { localStorage.setItem(CLAVE_MIAS, JSON.stringify(mias.map((t) => t.id))); } catch { /* sin storage */ }
}

const cerrada = (tx) => tx.estado === "confirmada" || tx.estado === "rechazada";

function pintarMias() {
  $("mias").replaceChildren(...(mias.length ? mias.map((tx) => el("li", { clase: "tx" },
    el("span", { clase: `chip ${tx.estado}` }, tx.estado),
    el("span", { clase: "mono" }, `${cuentaCorta(tx.origen)} → ${cuentaCorta(tx.destino)}: ${tx.monto}`),
    el("span", { clase: "mono suave" }, corto(tx.id)),
    tx.motivo ? el("span", { clase: "suave" }, tx.motivo) : "",
    tx.bloque ? el("span", { clase: "suave" }, `en el bloque ${corto(tx.bloque)}`) : "",
    tx.estado === "confirmada" && bloques.some((b) => b.block_hash === tx.bloque && b.finalizado)
      ? el("span", { clase: "chip confirmada" }, "finalizada") : ""))
    : [el("li", { clase: "vacio" }, "Todavía no hiciste ninguna.")]));
}

async function consultar(id) {
  const { ok, status, cuerpo } = await api(`/api/transacciones/${id}`);
  return ok ? cuerpo : status === 404 ? null : undefined;  // undefined: no se pudo saber
}

async function cargarMias() {
  const ids = leerIdsGuardados();
  const consultadas = await Promise.all(ids.map(consultar));
  // null (404): ya no existe y se olvida. undefined (falló la consulta): se queda lo que había.
  mias = ids.flatMap((id, i) => {
    if (consultadas[i]) return [consultadas[i]];
    if (consultadas[i] === null) return [];
    return [mias.find((t) => t.id === id) ?? { id, origen: "?", destino: "?", monto: "?", estado: "recibida" }];
  });
  guardarIds();
  pintarMias();
}

async function actualizarAbiertas() {
  const abiertas = mias.filter((tx) => !cerrada(tx));
  const consultadas = await Promise.all(abiertas.map((tx) => consultar(tx.id)));
  abiertas.forEach((tx, i) => { if (consultadas[i]) Object.assign(tx, consultadas[i]); });
  pintarMias();
}

// El NCT valida en milisegundos: el aviso puede llegar por SSE antes que la respuesta del POST.
// Los avisos de ids que todavía no conocemos se guardan un rato y se aplican al registrar la tx.
const AVISOS_GUARDADOS = 200;
const avisosSinDueño = new Map();

function estadoDeTransaccion(aviso) {
  const tx = mias.find((t) => t.id === aviso.id);
  if (!tx) {
    avisosSinDueño.set(aviso.id, aviso);
    if (avisosSinDueño.size > AVISOS_GUARDADOS) avisosSinDueño.delete(avisosSinDueño.keys().next().value);
    return;
  }
  if (cerrada(tx)) return;
  tx.estado = aviso.estado;
  if (aviso.motivo) tx.motivo = aviso.motivo;
  pintarMias();
}

function mostrarMensaje(texto, error = false) {
  const p = $("mensaje");
  p.textContent = texto;
  p.classList.toggle("error", error);
  p.hidden = !texto;
}

// ── Firmar en el navegador (BC-56): WebCrypto Ed25519, la privada no sale de acá ──

let firmante = null;  // {clave: CryptoKey sólo para firmar, cuenta: hex, ultimoNonce}


async function cargarCuenta() {
  if (!firmante) return;
  const { ok, cuerpo } = await api(`/api/cuentas/${firmante.cuenta}`);
  const caja = $("mi-cuenta");
  caja.hidden = false;
  if (!ok) { caja.replaceChildren(el("span", { clase: "suave" }, "No se pudo leer tu cuenta.")); return; }
  firmante.ultimoNonce = Math.max(firmante.ultimoNonce, cuerpo.nonce);
  caja.replaceChildren(
    el("span", {}, "Tu cuenta"), el("span", { clase: "mono" }, firmante.cuenta),
    el("span", {}, `saldo ${cuerpo.saldo - cuerpo.comprometido} disponible (${cuerpo.saldo} confirmado)`),
    el("span", { clase: "suave" }, `próximo nonce ${firmante.ultimoNonce + 1}`),
    cuerpo.aprobada ? "" : el("span", { clase: "chip rechazada" },
      cuerpo.alta_pedida ? "sin aprobar: el organizador todavía no aprobó tu pedido" : "sin aprobar: pedí el alta en /alta"));
}

$("form-clave").addEventListener("submit", async (evento) => {
  evento.preventDefault();
  try {
    firmante = { ...await importarClave(new FormData(evento.target).get("jwk")), ultimoNonce: 0 };
    evento.target.reset();
    evento.target.hidden = true;
    $("formulario").hidden = false;
    mostrarMensaje("");
    await cargarCuenta();
  } catch (error) {
    mostrarMensaje(`No se pudo usar la clave: ${error.message}. ${AVISO_NAVEGADOR}`, true);
  }
});

async function firmada(destino, monto) {
  const tx = { origen: firmante.cuenta, destino, monto, nonce: firmante.ultimoNonce + 1,
               timestamp: Math.floor(Date.now() / 1000) };
  return { ...tx, firma: await firmar(firmante.clave, mensajeTransaccion(tx)) };
}

$("formulario").addEventListener("submit", async (evento) => {
  evento.preventDefault();
  const formulario = evento.target;
  const datos = Object.fromEntries(new FormData(formulario));
  const boton = formulario.querySelector("button");
  boton.disabled = true;
  try {
    const tx = await firmada(datos.destino.trim(), Number(datos.monto));
    const { ok, status, cuerpo } = await api("/api/transacciones", {
      method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(tx) });
    if (ok) {
      firmante.ultimoNonce = tx.nonce;
      mias = [{ ...tx, id: cuerpo.id, estado: "recibida" }, ...mias].slice(0, MIAS_MAXIMO);
      guardarIds();
      pintarMias();
      const adelantado = avisosSinDueño.get(cuerpo.id);
      if (adelantado) { avisosSinDueño.delete(cuerpo.id); estadoDeTransaccion(adelantado); }
      mostrarMensaje(`Firmada y recibida: ${cuerpo.id} (nonce ${tx.nonce})`);
      formulario.reset();
      cargarCuenta();
    } else if (status === 400 || status === 409) {
      mostrarMensaje([].concat(cuerpo.errores || cuerpo.error || "datos inválidos").join(" · "), true);
    } else {
      mostrarMensaje("El sistema no pudo recibirla ahora; probá de nuevo en un momento.", true);
    }
  } catch {
    mostrarMensaje("No hay conexión con el servidor.", true);
  } finally {
    boton.disabled = false;
  }
});

// ── Pendientes y cajas ──

async function cargarCajas() {
  const { ok, cuerpo } = await api("/api/cajas");
  if (!ok) return;
  const apiladas = cuerpo.cajas.reduce((total, n) => total + n, 0);
  $("resumen-cajas").textContent =
    `${cuerpo.total_pendientes} validadas sin caja · ${apiladas} en ${cuerpo.cajas.length} ` +
    `caja${cuerpo.cajas.length === 1 ? "" : "s"}` +
    (cuerpo.cajas.length ? ` (${cuerpo.cajas.join(", ")})` : "");
  const resto = cuerpo.total_pendientes - cuerpo.pendientes.length;
  $("pendientes").replaceChildren(...cuerpo.pendientes.map((tx) => el("li", { clase: "tx" },
    el("span", { clase: "chip pendiente" }, "pendiente"),
    el("span", { clase: "mono" }, `${tipoDe(tx) || cuentaCorta(tx.origen)} → ${cuentaCorta(tx.destino)}: ${tx.monto}`),
    el("span", { clase: "mono suave" }, corto(tx.id)))),
    ...(resto > 0 ? [el("li", { clase: "suave" }, `y ${resto} más`)] : []));
}

// ── Todo junto ──

const alConfirmarBloque = [bloqueConfirmado, actualizarAbiertas, cargarCajas, cargarCuenta];

function recargarTodo() {
  return Promise.all([cargarCadena(), cargarMias(), cargarCajas()]);
}

// ── Avisos en vivo (SSE) ──

function escuchar() {
  const fuente = new EventSource("/eventos");
  let caido = false;
  fuente.onopen = () => {
    $("conexion").textContent = "en vivo";
    $("conexion").classList.add("vivo");
    if (caido) recargarTodo();  // pudo perderse algún aviso mientras estuvo caído
    caido = false;
  };
  fuente.onerror = () => {
    caido = true;
    $("conexion").textContent = "reconectando…";
    $("conexion").classList.remove("vivo");
  };
  fuente.addEventListener("transaccion.estado", (e) => estadoDeTransaccion(JSON.parse(e.data)));
  fuente.addEventListener("bloque.finalizado", () => cargarCadena());
  fuente.addEventListener("bloque.confirmado", (e) => {
    const aviso = JSON.parse(e.data);
    for (const reaccion of alConfirmarBloque) reaccion(aviso);
  });
  return fuente;
}

recargarTodo();
escuchar();
</script>
</body>
</html>
