<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blockchain distribuida</title>
<style>
  :root {
    --fondo: #f6f7f9; --panel: #ffffff; --texto: #1c2430; --suave: #5d6878; --borde: #dde2e8;
    --acento: #2f6fdf; --ok: #1f8a4c; --alerta: #b7791f; --error: #c0392b;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #12161c; --panel: #1a2029; --texto: #e4e8ee; --suave: #95a0b0; --borde: #2b3340;
      --acento: #6c9cf0; --ok: #4cc27f; --alerta: #e0a84a; --error: #ef6b5e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--texto);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 1.3rem; margin: 0; }
  h2 { font-size: 1rem; margin: 0 0 12px; }
  section { background: var(--panel); border: 1px solid var(--borde); border-radius: 10px; padding: 16px; }
  .estado { font-size: .85rem; color: var(--suave); display: inline-flex; align-items: center; gap: 6px; }
  .estado::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--alerta); }
  .estado.vivo::before { background: var(--ok); }
  .mono { font-family: var(--mono); font-size: .85rem; overflow-wrap: anywhere; }
  .suave { color: var(--suave); }
  .vacio { color: var(--suave); font-style: italic; }
  ul.lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  details { border: 1px solid var(--borde); border-radius: 8px; padding: 8px 12px; }
  details.nuevo { border-color: var(--acento); }
  summary { cursor: pointer; display: flex; gap: 12px; flex-wrap: wrap; align-items: baseline; }
  summary .altura { font-weight: 600; min-width: 3ch; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 10px 0 0; }
  dt { color: var(--suave); }
  dd { margin: 0; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; margin-top: 8px; }
  th, td { text-align: left; padding: 4px 6px; border-top: 1px solid var(--borde); }
  th { color: var(--suave); font-weight: 500; }
  td.num, th.num { text-align: right; }
  form { display: grid; grid-template-columns: 1fr 1fr 8rem auto; gap: 8px; align-items: end; }
  @media (max-width: 560px) { form { grid-template-columns: 1fr 1fr; } }
  label { display: grid; gap: 4px; font-size: .85rem; color: var(--suave); }
  input { font: inherit; color: var(--texto); background: var(--fondo); border: 1px solid var(--borde);
          border-radius: 6px; padding: 6px 8px; width: 100%; min-width: 0; }
  button { font: inherit; color: #fff; background: var(--acento); border: 0; border-radius: 6px;
           padding: 7px 14px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .mensaje { margin: 10px 0 0; font-size: .9rem; }
  .mensaje.error { color: var(--error); }
  .chip { display: inline-block; font-size: .78rem; padding: 1px 8px; border-radius: 999px;
          border: 1px solid currentColor; white-space: nowrap; }
  .chip.recibida { color: var(--suave); }
  .chip.pendiente { color: var(--alerta); }
  .chip.confirmada { color: var(--ok); }
  .chip.rechazada { color: var(--error); }
  .tx { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Blockchain distribuida</h1>
    <span id="conexion" class="estado">conectando…</span>
  </header>

  <section aria-labelledby="t-transferir">
    <h2 id="t-transferir">Transferir</h2>
    <form id="formulario" autocomplete="off">
      <label>Origen <input name="origen" required maxlength="32" pattern="[A-Za-z0-9_-]+"></label>
      <label>Destino <input name="destino" required maxlength="32" pattern="[A-Za-z0-9_-]+"></label>
      <label>Monto <input name="monto" required type="number" min="1" step="1"></label>
      <button type="submit">Enviar</button>
    </form>
    <p id="mensaje" class="mensaje" hidden></p>
    <h2 style="margin-top:16px">Mis transferencias</h2>
    <ul id="mias" class="lista"><li class="vacio">Todavía no hiciste ninguna.</li></ul>
  </section>

  <section aria-labelledby="t-pendientes">
    <h2 id="t-pendientes">Esperando bloque</h2>
    <p id="resumen-cajas" class="suave">Cargando…</p>
    <ul id="pendientes" class="lista"></ul>
  </section>

  <section aria-labelledby="t-mineros">
    <h2 id="t-mineros">Mineros vivos</h2>
    <div id="mineros" class="suave">Cargando…</div>
  </section>

  <section aria-labelledby="t-cadena">
    <h2 id="t-cadena">Cadena</h2>
    <ul id="bloques" class="lista"><li class="vacio">Cargando…</li></ul>
  </section>
</main>

<script>
"use strict";
const BLOQUES_VISIBLES = 20;

const $ = (id) => document.getElementById(id);
const corto = (hash) => hash ? `${hash.slice(0, 10)}…` : "—";
const hora = (segundos) => new Date(segundos * 1000).toLocaleString();

function el(etiqueta, atributos = {}, ...hijos) {
  const nodo = document.createElement(etiqueta);
  for (const [clave, valor] of Object.entries(atributos)) {
    if (clave === "clase") nodo.className = valor; else nodo.setAttribute(clave, valor);
  }
  for (const hijo of hijos) nodo.append(hijo);
  return nodo;
}

async function api(ruta, opciones) {
  const respuesta = await fetch(ruta, opciones);
  const cuerpo = await respuesta.json().catch(() => ({}));
  return { ok: respuesta.ok, status: respuesta.status, cuerpo };
}

// ── Cadena ──

let bloques = [];  // del más nuevo al más viejo

function vistaBloque(bloque, nuevo = false) {
  const filas = bloque.transactions.map((tx) => el("tr", {},
    el("td", { clase: "mono" }, tx.origen), el("td", { clase: "mono" }, tx.destino),
    el("td", { clase: "num" }, String(tx.monto))));
  return el("li", {}, el("details", nuevo ? { clase: "nuevo" } : {},
    el("summary", {},
      el("span", { clase: "altura" }, `#${bloque.altura}`),
      el("span", { clase: "mono" }, corto(bloque.block_hash)),
      el("span", { clase: "suave" }, `${bloque.transactions.length} tx`),
      el("span", { clase: "suave" }, bloque.minero ? `minó ${bloque.minero}` : "génesis")),
    el("dl", {},
      el("dt", {}, "hash"), el("dd", { clase: "mono" }, bloque.block_hash),
      el("dt", {}, "anterior"), el("dd", { clase: "mono" }, bloque.previous_hash),
      el("dt", {}, "nonce"), el("dd", { clase: "mono" }, String(bloque.nonce)),
      el("dt", {}, "prefijo"), el("dd", { clase: "mono" }, bloque.prefijo || "—"),
      el("dt", {}, "recompensa"), el("dd", {}, String(bloque.recompensa)),
      el("dt", {}, "hora"), el("dd", {}, hora(bloque.timestamp))),
    el("table", {},
      el("thead", {}, el("tr", {}, el("th", {}, "origen"), el("th", {}, "destino"), el("th", { clase: "num" }, "monto"))),
      el("tbody", {}, ...filas))));
}

function pintarCadena(nuevo) {
  const lista = $("bloques");
  lista.replaceChildren(...(bloques.length
    ? bloques.map((b) => vistaBloque(b, b.block_hash === nuevo))
    : [el("li", { clase: "vacio" }, "Todavía no hay bloques.")]));
}

async function cargarCadena() {
  const { ok, cuerpo } = await api(`/api/bloques?limite=${BLOQUES_VISIBLES}`);
  if (ok) { bloques = cuerpo; pintarCadena(); }
}

async function bloqueConfirmado(aviso) {
  if (bloques.some((b) => b.block_hash === aviso.block_hash)) return;
  const { ok, cuerpo } = await api(`/api/bloques/${aviso.block_hash}`);
  if (!ok) return;
  bloques = [cuerpo, ...bloques].sort((a, b) => b.altura - a.altura).slice(0, BLOQUES_VISIBLES);
  pintarCadena(cuerpo.block_hash);
}

// ── Mis transferencias (las últimas 20 de este navegador) ──

const MIAS_MAXIMO = 20;
const CLAVE_MIAS = "mis-transferencias";
let mias = [];  // [{id, origen, destino, monto, estado, motivo?, bloque?}], la más nueva primero

function leerIdsGuardados() {
  try { return JSON.parse(localStorage.getItem(CLAVE_MIAS)) || []; } catch { return []; }
}

function guardarIds() {
  try { localStorage.setItem(CLAVE_MIAS, JSON.stringify(mias.map((t) => t.id))); } catch { /* sin storage */ }
}

const cerrada = (tx) => tx.estado === "confirmada" || tx.estado === "rechazada";

function pintarMias() {
  $("mias").replaceChildren(...(mias.length ? mias.map((tx) => el("li", { clase: "tx" },
    el("span", { clase: `chip ${tx.estado}` }, tx.estado),
    el("span", {}, `${tx.origen} → ${tx.destino}: ${tx.monto}`),
    el("span", { clase: "mono suave" }, corto(tx.id)),
    tx.motivo ? el("span", { clase: "suave" }, tx.motivo) : "",
    tx.bloque ? el("span", { clase: "suave" }, `en el bloque ${corto(tx.bloque)}`) : ""))
    : [el("li", { clase: "vacio" }, "Todavía no hiciste ninguna.")]));
}

async function consultar(id) {
  const { ok, status, cuerpo } = await api(`/api/transacciones/${id}`);
  return ok ? cuerpo : status === 404 ? null : undefined;  // undefined: no se pudo saber
}

async function cargarMias() {
  const ids = leerIdsGuardados();
  const consultadas = await Promise.all(ids.map(consultar));
  // null (404): ya no existe y se olvida. undefined (falló la consulta): se queda lo que había.
  mias = ids.flatMap((id, i) => {
    if (consultadas[i]) return [consultadas[i]];
    if (consultadas[i] === null) return [];
    return [mias.find((t) => t.id === id) ?? { id, origen: "?", destino: "?", monto: "?", estado: "recibida" }];
  });
  guardarIds();
  pintarMias();
}

async function actualizarAbiertas() {
  const abiertas = mias.filter((tx) => !cerrada(tx));
  const consultadas = await Promise.all(abiertas.map((tx) => consultar(tx.id)));
  abiertas.forEach((tx, i) => { if (consultadas[i]) Object.assign(tx, consultadas[i]); });
  pintarMias();
}

function estadoDeTransaccion(aviso) {
  const tx = mias.find((t) => t.id === aviso.id);
  if (!tx || cerrada(tx)) return;
  tx.estado = aviso.estado;
  if (aviso.motivo) tx.motivo = aviso.motivo;
  pintarMias();
}

function mostrarMensaje(texto, error = false) {
  const p = $("mensaje");
  p.textContent = texto;
  p.classList.toggle("error", error);
  p.hidden = !texto;
}

$("formulario").addEventListener("submit", async (evento) => {
  evento.preventDefault();
  const formulario = evento.target;
  const datos = Object.fromEntries(new FormData(formulario));
  const tx = { origen: datos.origen.trim(), destino: datos.destino.trim(), monto: Number(datos.monto) };
  const boton = formulario.querySelector("button");
  boton.disabled = true;
  try {
    const { ok, status, cuerpo } = await api("/api/transacciones", {
      method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(tx) });
    if (ok) {
      mias = [{ ...tx, id: cuerpo.id, estado: "recibida" }, ...mias].slice(0, MIAS_MAXIMO);
      guardarIds();
      pintarMias();
      mostrarMensaje(`Recibida: ${cuerpo.id}`);
      formulario.reset();
    } else if (status === 400) {
      mostrarMensaje([].concat(cuerpo.errores || "datos inválidos").join(" · "), true);
    } else {
      mostrarMensaje("El sistema no pudo recibirla ahora; probá de nuevo en un momento.", true);
    }
  } catch {
    mostrarMensaje("No hay conexión con el servidor.", true);
  } finally {
    boton.disabled = false;
  }
});

// ── Pendientes y cajas ──

async function cargarCajas() {
  const { ok, cuerpo } = await api("/api/cajas");
  if (!ok) return;
  const apiladas = cuerpo.cajas.reduce((total, n) => total + n, 0);
  $("resumen-cajas").textContent =
    `${cuerpo.total_pendientes} validadas sin caja · ${apiladas} en ${cuerpo.cajas.length} ` +
    `caja${cuerpo.cajas.length === 1 ? "" : "s"}` +
    (cuerpo.cajas.length ? ` (${cuerpo.cajas.join(", ")})` : "");
  const resto = cuerpo.total_pendientes - cuerpo.pendientes.length;
  $("pendientes").replaceChildren(...cuerpo.pendientes.map((tx) => el("li", { clase: "tx" },
    el("span", { clase: "chip pendiente" }, "pendiente"),
    el("span", {}, `${tx.origen} → ${tx.destino}: ${tx.monto}`),
    el("span", { clase: "mono suave" }, corto(tx.id)))),
    ...(resto > 0 ? [el("li", { clase: "suave" }, `y ${resto} más`)] : []));
}

// ── Mineros ──

function velocidad(hashes) {
  if (hashes == null) return "—";
  const unidades = [["GH/s", 1e9], ["MH/s", 1e6], ["kH/s", 1e3]];
  for (const [unidad, valor] of unidades) if (hashes >= valor) return `${(hashes / valor).toFixed(1)} ${unidad}`;
  return `${Math.round(hashes)} H/s`;
}

async function cargarMineros() {
  const { ok, cuerpo } = await api("/api/mineros");
  if (!ok) return;
  const vivos = cuerpo.filter((m) => m.vivo);
  const caidos = cuerpo.length - vivos.length;
  const pie = caidos ? [el("p", { clase: "suave" }, `${caidos} sin avisar hace rato`)] : [];
  if (!vivos.length) {
    $("mineros").replaceChildren(el("p", { clase: "vacio" }, "No hay mineros vivos."), ...pie);
    return;
  }
  $("mineros").replaceChildren(el("table", {},
    el("thead", {}, el("tr", {}, ...["minero", "tipo", "placa", "bench", "ahora", "saldo"]
      .map((t, i) => el("th", i >= 3 ? { clase: "num" } : {}, t)))),
    el("tbody", {}, ...vivos.map((m) => el("tr", {},
      el("td", { clase: "mono" }, m.id), el("td", {}, m.tipo ?? "—"), el("td", {}, m.placa ?? "—"),
      el("td", { clase: "num" }, velocidad(m.bench)), el("td", { clase: "num" }, velocidad(m.hashes_por_segundo)),
      el("td", { clase: "num" }, String(m.saldo)))))), ...pie);
}

// ── Todo junto ──

const alConfirmarBloque = [bloqueConfirmado, actualizarAbiertas, cargarCajas, cargarMineros];

function recargarTodo() {
  return Promise.all([cargarCadena(), cargarMias(), cargarCajas(), cargarMineros()]);
}

// ── Avisos en vivo (SSE) ──

function escuchar() {
  const fuente = new EventSource("/eventos");
  let caido = false;
  fuente.onopen = () => {
    $("conexion").textContent = "en vivo";
    $("conexion").classList.add("vivo");
    if (caido) recargarTodo();  // pudo perderse algún aviso mientras estuvo caído
    caido = false;
  };
  fuente.onerror = () => {
    caido = true;
    $("conexion").textContent = "reconectando…";
    $("conexion").classList.remove("vivo");
  };
  fuente.addEventListener("transaccion.estado", (e) => estadoDeTransaccion(JSON.parse(e.data)));
  fuente.addEventListener("bloque.confirmado", (e) => {
    const aviso = JSON.parse(e.data);
    for (const reaccion of alConfirmarBloque) reaccion(aviso);
  });
  return fuente;
}

recargarTodo();
escuchar();
</script>
</body>
</html>
