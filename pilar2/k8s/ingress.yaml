# La puerta HTTP del sistema (Traefik en k3s): /api al backend; / y /eventos (SSE) al frontend.
# Sin host: responde en cualquier nombre o IP del nodo, por el puerto 80.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blockchain
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: backend, port: { name: http } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { name: http } }
