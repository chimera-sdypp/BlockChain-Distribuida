# kubectl apply -k pilar2/k8s  (antes, crear el Secret: ver pilar2/README.md)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: blockchain

resources:
  - namespace.yaml
  - rabbitmq.yaml
  - redis.yaml
  - backend.yaml
  - nct.yaml
  - trp.yaml
  - gateway.yaml
  - frontend.yaml
  - ingress.yaml

configMapGenerator:
  - name: rabbitmq-config
    files:
      - rabbitmq/rabbitmq.conf
      - rabbitmq/enabled_plugins
      - rabbitmq/colas.json
      - rabbitmq/iniciar.sh
  - name: redis-config
    files:
      - redis/iniciar.sh
