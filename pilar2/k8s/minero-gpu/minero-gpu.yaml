# Minero GPU (BC-27) en el k3s de una PC con NVIDIA (BC-36): no va en k8s/kustomization.yaml,
# porque corre en otro cluster y le habla al gateway de GKE por su IP pública.
# Se despliega con desplegar.sh (ver README.md de esta carpeta), que completa GATEWAY_URL y la imagen.
# Que entre o salga una GPU es escalar el StatefulSet: kubectl scale statefulset minero-gpu --replicas=N
#
# StatefulSet y no Deployment: cada réplica tiene un nombre fijo (minero-gpu-0, -1…), que es su alias,
# y su clave Ed25519 sale de ese nombre y de la semilla del Secret (BC-57). Así un pod que se reinicia
# vuelve con la misma cuenta, la que aprobó el organizador.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minero-gpu
  labels: { app: minero-gpu }
spec:
  serviceName: minero-gpu
  replicas: 1
  podManagementPolicy: Parallel   # no hace falta orden: cada minero es independiente
  selector:
    matchLabels: { app: minero-gpu }
  template:
    metadata:
      labels: { app: minero-gpu }
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      # El runtime de NVIDIA (nvidia-container-toolkit) le pasa la GPU y el driver al contenedor.
      runtimeClassName: nvidia
      containers:
        - name: minero-gpu
          # La CI la publica en GHCR: :main al mergear a main, :dev a dev y :<sha>.
          image: ghcr.io/chimera-sdypp/minero-gpu:main
          env:
            - { name: CUDA_CACHE_PATH, value: /tmp/nv }
            - { name: GATEWAY_URL, value: "http://GATEWAY_IP:8081" }
            # El alias de cada minero es el nombre del pod: cada réplica es una cuenta y cobra lo suyo.
            - name: MINERO_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: CLAVE_SEMILLA
              valueFrom: { secretKeyRef: { name: minero-gpu, key: CLAVE_SEMILLA } }
          volumeMounts:
            - { name: logs, mountPath: /app/logs }
            - { name: tmp, mountPath: /tmp }
          resources:
            limits: { nvidia.com/gpu: 1, memory: 512Mi }
            requests: { cpu: 100m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
