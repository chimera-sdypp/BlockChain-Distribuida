# Alertas del sistema (BC-37). Sin receivers: se ven en la UI de Grafana, Prometheus o Alertmanager.
# Las métricas que vienen de Redis las reportan igual las 2 réplicas: por eso max().
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: blockchain-alertas
spec:
  groups:
    - name: blockchain
      rules:
        - alert: SinMinerosGPU
          # «vale 0 o no existe»: sin el gateway (o antes del primer scrape) no hay serie.
          expr: (max(blockchain_mineros{tipo="gpu"}) or vector(0)) == 0
          for: 1m
          labels: { severity: warning }
          annotations:
            summary: No queda ningún minero GPU vivo
            description: El sistema mina sólo con CPU (o no mina); KEDA debería prender el escalador.

        - alert: ColaRangosAcumulada
          # Umbral provisorio: se ajusta con las pruebas de desempeño (BC-38 a BC-41).
          expr: max(rabbitmq_queue_messages{queue="rangos"}) > 50
          for: 2m
          labels: { severity: warning }
          annotations:
            summary: "{{ $value }} rangos esperan un minero"
            description: Los mineros no dan abasto con los rangos publicados por el TrP.

        - alert: SinBloquesNuevos
          # Sólo con trabajo apilado: el sistema ocioso no confirma bloques y está bien.
          expr: |
            sum(increase(blockchain_bloques_total[10m])) == 0
            and on() (max(blockchain_tx_pendientes) + max(blockchain_tx_en_cajas)) > 0
          labels: { severity: critical }
          annotations:
            summary: Hay transacciones apiladas y no salió ningún bloque en 10 minutos

        - alert: MineroSuspendido
          # BC-75: el gateway suspendió a un minero que contestó «sin solución» en un rango que la tenía.
          expr: max(blockchain_mineros_suspendidos) > 0
          labels: { severity: warning }
          annotations:
            summary: "{{ $value }} minero(s) suspendido(s) esperan la decisión del organizador"
            description: En el panel del organizador, «Mineros suspendidos», está la evidencia; reactivar o confirmar la baja.

        # Contrato v3 (BC-80, BC-83, BC-86): que no haya que confiar en quien opera la nube.
        - alert: CacheDistintoDeLaCadena
          expr: sum(increase(blockchain_estado_divergencias_total[10m])) > 0
          labels: { severity: critical }
          annotations:
            summary: El caché de Redis no coincidía con la cadena
            description: Alguien tocó saldos, cuentas, nonces o permisos en Redis. El NCT lo corrigió desde la cadena.

        - alert: NodoRechazoUnBloque
          expr: sum(increase(blockchain_nodo_rechazos_total[10m])) > 0 or sum(increase(blockchain_nodo_conflictos_total[10m])) > 0
          labels: { severity: critical }
          annotations:
            summary: Un nodo verificador rechazó un bloque o vio la historia reescrita
            description: Ver /nodos/<n>/api/rechazos. Un bloque que no cumple el contrato llegó a la cadena.

        - alert: NodosNoCoinciden
          expr: (max(blockchain_nodo_altura) - min(blockchain_nodo_altura)) > 3 or (count(count_values("punta", blockchain_nodo_punta)) > 1 and max(blockchain_nodo_altura) == min(blockchain_nodo_altura))
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: Los nodos verificadores no están en la misma punta

        - alert: FinalidadAtrasada
          expr: max(blockchain_validadores) > 0 and (max(blockchain_nodo_altura) - max(blockchain_altura_finalizada)) > 10
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: Hay validadores pero los bloques no se finalizan
            description: Más de 10 bloques sin las firmas de 2/3 de los validadores (caídos, o se niegan a firmar).

        - alert: ServicioCaido
          # El escalador apagado (0 réplicas) es su estado normal: KEDA lo prende cuando hace falta.
          expr: |
            up{namespace="blockchain"} == 0
            or kube_deployment_status_replicas_available{namespace="blockchain", deployment!="escalador"} == 0
            or kube_statefulset_status_replicas_ready{namespace="blockchain", statefulset!="escalador"} == 0
          for: 30s
          labels: { severity: critical }
          annotations:
            summary: "{{ $labels.namespace }}: {{ $labels.pod }}{{ $labels.deployment }}{{ $labels.statefulset }} no responde"
