# /metrics de cada servicio Python, pod por pod (el NCT no tiene Service: por eso PodMonitor).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: blockchain-apps
spec:
  selector:
    matchExpressions:
      - { key: app, operator: In, values: [backend, frontend, nct, trp, gateway, escalador, nodo] }
  podMetricsEndpoints:
    - { port: http, path: /metrics, interval: 10s }
---
# RabbitMQ: /metrics/per-object da los mensajes de cada cola (rabbitmq_queue_messages{queue=…}).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: rabbitmq
spec:
  selector:
    matchLabels: { app: rabbitmq }
  podMetricsEndpoints:
    - { port: prometheus, path: /metrics/per-object, interval: 10s }
---
# Traefik (kube-system en k3s, traefik en GKE): traefik_service_requests_total{code="429"} da los rechazos de los
# límites de ritmo (BC-94) en el panel «Rechazos de entrada».
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: traefik
spec:
  namespaceSelector: { any: true }
  selector:
    matchLabels: { app.kubernetes.io/name: traefik }
  podMetricsEndpoints:
    - { port: metrics, path: /metrics, interval: 30s }
