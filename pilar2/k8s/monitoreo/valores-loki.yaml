# Loki en un solo pod (chart grafana/loki, release loki, namespace monitoring). Ver pilar2/README.md.
# Grafana lo encuentra en loki.monitoring.svc:3100 (valores-prometheus.yaml); Fluent Bit le escribe ahí.
deploymentMode: SingleBinary
loki:
  auth_enabled: false  # un solo tenant
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13  # el que admite metadatos estructurados (el pod de cada línea)
        index: { prefix: index_, period: 24h }
  limits_config:
    allow_structured_metadata: true
    retention_period: 72h  # 3 días, como Prometheus
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  pattern_ingester: { enabled: false }

singleBinary:
  replicas: 1
  persistence:
    size: 2Gi
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 512Mi }  # que una ráfaga de logs no se coma el nodo

# Sólo el binario: sin caches, gateway, canary ni los componentes del modo distribuido.
chunksCache: { enabled: false }
resultsCache: { enabled: false }
gateway: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
read: { replicas: 0 }
write: { replicas: 0 }
backend: { replicas: 0 }
