# NCT (BC-23): valida transacciones, arma cajas y tareas, y verifica y guarda los bloques.
# 2 réplicas que se coordinan sólo por Redis (Lua y SET NX). No recibe tráfico HTTP: sin Service;
# /metrics lo lee Prometheus por las anotaciones del pod.
# La imagen se construye a mano (ver pilar2/nct/README.md) hasta que haya Artifact Registry (BC-31).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nct
  labels: { app: nct }
spec:
  replicas: 2
  selector:
    matchLabels: { app: nct }
  template:
    metadata:
      labels: { app: nct }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: nct
          image: nct:dev
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: RABBIT_HOST, value: rabbitmq }
            - { name: REDIS_SENTINELS, value: "redis:26379" }
            - { name: VENTANA_SEGUNDOS, value: "30" }
            - { name: TX_POR_CAJA, value: "100" }
            - { name: TAREA_VENCE_SEGUNDOS, value: "600" }
            - { name: WAIT_REPLICAS, value: "1" }       # Redis tiene 2 réplicas: esperar a una
            # Las cuentas de prueba alice, bob y carol (comun/tests/claves.py: sus privadas salen de
            # sha256("chimera-prueba-<nombre>")). En la red de verdad el génesis va vacío y el saldo entra por cargas.
            - name: SALDOS_INICIALES
              value: '{"0e80f23abd9643bfa3bf7379857f5b44ad848c7b04150041ededd2bd441d3ff1": {"saldo": 1000, "nombre": "alice"}, "8c092b4d0126f911f5b6533cb2ab5854e74e1ea5379f9260ff0b44ea8d298db5": {"saldo": 1000, "nombre": "bob"}, "a12b9d664c3ec7510795e0917fe1755a7206dc12ebca06086e4e579b6021eb3f": {"saldo": 1000, "nombre": "carol"}}'
            # El organizador, que firma las cargas de saldo. En k3s el de prueba; en GKE otro
            # (pilar3/k8s/apps/nct-saldos.yaml).
            - { name: ORGANIZADOR_CLAVE, value: "e3d316b540c0cb8b0ed8336394d485d3154a8e569e8a3fa29deb71fc371a7117" }
            - name: RABBIT_USUARIO
              valueFrom: { secretKeyRef: { name: blockchain-secretos, key: RABBIT_USUARIO } }
            - name: RABBIT_CLAVE
              valueFrom: { secretKeyRef: { name: blockchain-secretos, key: RABBIT_CLAVE } }
            - name: REDIS_CLAVE
              valueFrom: { secretKeyRef: { name: blockchain-secretos, key: REDIS_CLAVE } }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 2
          # /metrics no depende de RabbitMQ ni de Redis: reinicia sólo si el proceso se colgó.
          livenessProbe:
            httpGet: { path: /metrics, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001     # el usuario «app» del Dockerfile
