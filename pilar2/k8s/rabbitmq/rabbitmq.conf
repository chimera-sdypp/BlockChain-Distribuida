# Cluster: desde 4.1 el plugin k8s no consulta la API; rabbitmq-1 y -2 se unen a rabbitmq-0.
cluster_formation.peer_discovery_backend = k8s

# Colas, exchange y vhost (colas.json) y el usuario (usuario.json, lo arma iniciar.sh con el Secret).
load_definitions = /definiciones

# Las colas quorum se declaran cuando sólo está rabbitmq-0: al sumarse los otros nodos, crecen a 3 réplicas.
quorum_queue.continuous_membership_reconciliation.enabled = true
quorum_queue.continuous_membership_reconciliation.target_group_size = 3

# Reparte los líderes de las colas entre los 3 nodos.
queue_leader_locator = balanced
