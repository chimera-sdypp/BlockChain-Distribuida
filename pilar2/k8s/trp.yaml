# TrP (BC-21 y BC-22): parte las tareas en rangos y elige al ganador de cada una.
# Se coordina por Redis (HSETNX y conjuntos), con HPA entre 2 y 4 réplicas (BC-102). Sin Service HTTP.
# La imagen se construye a mano hasta que haya Artifact Registry (BC-31).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: trp
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trp
  labels: { app: trp }
spec:
  # Sin `replicas`: lo maneja el HorizontalPodAutoscaler (minReplicas: 2).
  selector:
    matchLabels: { app: trp }
  template:
    metadata:
      labels: { app: trp }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: trp
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: trp }
      containers:
        - name: trp
          image: trp:dev
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: RABBIT_HOST, value: rabbitmq }
            - { name: REDIS_SENTINELS, value: "redis:26379" }
            - { name: PREFIJO_BASE, value: "6" }
            - { name: SEGUNDOS_POR_BLOQUE, value: "60" }
            - { name: VENTANA_AJUSTE, value: "5" }
            - { name: AJUSTE_MAXIMO, value: "1" }
            - { name: FRAGMENTO_PORCENTAJE, value: "10" }
            # BC-73: al menos 16^PREFIJO_BASE × 4 (si no, el TrP no arranca); 2^32 alcanza hasta el prefijo 6.
            - { name: ESPACIO_NONCES, value: "4294967296" }
            # Sin bloque en 240 s (4 × SEGUNDOS_POR_BLOQUE), un carácter menos. El mismo valor que en el NCT.
            - { name: EMERGENCIA_SEGUNDOS, value: "240" }
            - name: RABBIT_USUARIO
              valueFrom: { secretKeyRef: { name: blockchain-secretos, key: RABBIT_USUARIO } }
            - name: RABBIT_CLAVE
              valueFrom: { secretKeyRef: { name: blockchain-secretos, key: RABBIT_CLAVE } }
            - name: REDIS_CLAVE
              valueFrom: { secretKeyRef: { name: blockchain-secretos, key: REDIS_CLAVE } }
          volumeMounts:
            - { name: logs, mountPath: /app/logs }
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 2
          # /metrics no depende de RabbitMQ ni de Redis: reinicia sólo si el proceso se colgó.
          livenessProbe:
            httpGet: { path: /metrics, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001     # el usuario «app» del Dockerfile
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: trp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: trp
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
