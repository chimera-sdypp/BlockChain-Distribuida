# Traefik (Pipeline 2, BC-33): el Ingress controller del cluster, en el nodegroup de infra.
# Su Service (LoadBalancer, el tipo por defecto del chart) es la IP pública del sistema (puerto 80): /api → backend; / y /eventos → frontend.
#   helm upgrade --install traefik traefik/traefik --version 42.3.2 -n traefik --create-namespace -f traefik.yaml
deployment:
  replicas: 2

# Clase por defecto: el Ingress del Pilar 2 no nombra ninguna (en k3s también es Traefik).
ingressClass:
  enabled: true
  isDefaultClass: true

providers:
  kubernetesIngress:
    publishedService:
      enabled: true

nodeSelector:
  nodegroup: infra
tolerations:
  - { key: nodegroup, operator: Equal, value: infra, effect: NoSchedule }

# BC-94: el límite de ritmo de los POST de /api (pilar2/k8s/limites) cuenta por X-Real-Ip.
# - externalTrafficPolicy Local: el LoadBalancer no reemplaza la IP de origen por la de un nodo (con Cluster, Traefik veía
#   10.x para todos). El tráfico entra sólo por los nodos que tienen un pod de Traefik.
# - trustedIPs: las únicas IPs de las que Traefik acepta X-Real-Ip y X-Forwarded-*: las de Cloudflare, donde el Worker
#   pone la IP del cliente (pilar3/cloudflare/worker.mjs). A cualquier otro se las pisa con su IP: nadie la inventa.
#   Rangos de https://www.cloudflare.com/ips-v4 y /ips-v6, copiados el 27/11/2026.
service:
  spec:
    externalTrafficPolicy: Local

ports:
  web:
    forwardedHeaders:
      trustedIPs: &cloudflare
        - 173.245.48.0/20
        - 103.21.244.0/22
        - 103.22.200.0/22
        - 103.31.4.0/22
        - 141.101.64.0/18
        - 108.162.192.0/18
        - 190.93.240.0/20
        - 188.114.96.0/20
        - 197.234.240.0/22
        - 198.41.128.0/17
        - 162.158.0.0/15
        - 104.16.0.0/13
        - 104.24.0.0/14
        - 172.64.0.0/13
        - 131.0.72.0/22
        - 2400:cb00::/32
        - 2606:4700::/32
        - 2803:f800::/32
        - 2405:b500::/32
        - 2405:8100::/32
        - 2a06:98c0::/29
        - 2c0f:f248::/32
  websecure:
    forwardedHeaders:
      trustedIPs: *cloudflare
