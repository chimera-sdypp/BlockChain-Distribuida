# En GKE el génesis va vacío (BC-91): sin cuentas con saldo. La plata entra sólo por cargas firmadas por el
# organizador (modelo exchange). SALDOS_INICIALES="{}" pisa las cuentas de prueba del manifiesto de k3s
# (pilar2/k8s/nct.yaml), cuyas privadas salen del repo. Las cuentas de las pruebas de carga se generan fuera
# del repo y las da de alta y les carga saldo el organizador (pilar3/pruebas/README.md). El CI frena un
# manifiesto de pilar3/ con saldos en el génesis o una cuenta de prueba (pilar3/k8s/sin_cuentas_de_prueba.py).
#
# El organizador de GKE no es el de prueba: su privada no está en el repo (la tiene Tomás). Es la cuenta
# que firma las cargas de saldo (BC-58); el backend la usa para validarlas y el NCT para aceptarlas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nct
spec:
  template:
    spec:
      containers:
        - name: nct
          env:
            - { name: SALDOS_INICIALES, value: "{}" }
            - { name: ORGANIZADOR_CLAVE, value: "1f38cfb7ad5d7bda45b400742c57058e8179205b190cc3ae86d272611f5b1245" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  template:
    spec:
      containers:
        - name: backend
          env:
            - { name: ORGANIZADOR_CLAVE, value: "1f38cfb7ad5d7bda45b400742c57058e8179205b190cc3ae86d272611f5b1245" }
