# Los emisores de Let's Encrypt (Pipeline 2). Validan el dominio por HTTP-01: cert-manager publica un
# token en http://<dominio>/.well-known/acme-challenge/ con un Ingress temporal de Traefik.
# «letsencrypt-pruebas» da certificados que el navegador no acepta, pero no tiene los límites de
# producción: sirve para probar sin gastar intentos. El Ingress usa «letsencrypt».
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef: { name: letsencrypt-cuenta }
    solvers:
      - http01:
          ingress: { ingressClassName: traefik }
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-pruebas
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef: { name: letsencrypt-pruebas-cuenta }
    solvers:
      - http01:
          ingress: { ingressClassName: traefik }
